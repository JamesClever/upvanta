<aside class="sidebar">

    <!-- ==========================================
         LOGO
    =========================================== -->

    <div class="sidebar-logo">

        <a href="{{ url_for('dashboard.index') }}">

            <span class="logo-mark">▲</span>

            <span class="logo-text">

                UPVANTA

            </span>

        </a>

    </div>



    <!-- ==========================================
         NAVIGATION
    =========================================== -->

    <nav class="sidebar-nav">

        <a
            href="{{ url_for('dashboard.index') }}"
            class="sidebar-link {% if request.endpoint == 'dashboard.index' %}active{% endif %}">

            <span class="sidebar-icon">🏠</span>

            <span>Dashboard</span>

        </a>


        <a
            href="{{ url_for('jobs.list_jobs') }}"
            class="sidebar-link {% if request.endpoint.startswith('jobs.') %}active{% endif %}">

            <span class="sidebar-icon">💼</span>

            <span>Jobs</span>

        </a>


        <a
            href="{{ url_for('courses.list_courses') }}"
            class="sidebar-link {% if request.endpoint.startswith('courses.') %}active{% endif %}">

            <span class="sidebar-icon">📚</span>

            <span>Courses</span>

        </a>


        <a
            href="{{ url_for('scholarships.list_scholarships') }}"
            class="sidebar-link {% if request.endpoint.startswith('scholarships.') %}active{% endif %}">

            <span class="sidebar-icon">🎓</span>

            <span>Scholarships</span>

        </a>


        <a
            href="{{ url_for('mentorships.list_mentorships') }}"
            class="sidebar-link {% if request.endpoint.startswith('mentorships.') %}active{% endif %}">

            <span class="sidebar-icon">🤝</span>

            <span>Mentorships</span>

        </a>


        <a
            href="{{ url_for('resume.list_resumes') }}"
            class="sidebar-link {% if request.endpoint.startswith('resume.') %}active{% endif %}">

            <span class="sidebar-icon">📄</span>

            <span>Resume Builder</span>

        </a>


        <a
            href="{{ url_for('assist.index') }}"
            class="sidebar-link {% if request.endpoint.startswith('assist.') %}active{% endif %}">

            <span class="sidebar-icon">🚀</span>

            <span>Upvanta Assist</span>

        </a>


        <a
            href="{{ url_for('ai.ai_coach') }}"
            class="sidebar-link {% if request.endpoint.startswith('ai.') %}active{% endif %}">

            <span class="sidebar-icon">🤖</span>

            <span>AI Coach</span>

        </a>


        <a
            href="{{ url_for('profile.index') }}"
            class="sidebar-link {% if request.endpoint.startswith('profile.') %}active{% endif %}">

            <span class="sidebar-icon">👤</span>

            <span>Profile</span>

        </a>

    </nav>



    <!-- ==========================================
         USER
    =========================================== -->

    <div class="sidebar-bottom">

        <div class="sidebar-user">

            {% set avatar_class = "sidebar-avatar" %}
            {% include "components/avatar.html" %}

            <div class="sidebar-user-info">

                <strong>

                    {{ current_user.full_name }}

                </strong>

                <small>

                    Career Explorer

                </small>

            </div>

        </div>

        <a
            href="{{ url_for('auth.logout') }}"
            class="sidebar-logout">

            <span>Logout</span>

        </a>

    </div>


</aside>
