{% if user.profile_picture and user.profile_picture != "default_avatar.webp" %}

<img
    src="{{ url_for('static', filename='uploads/profile_pictures/' ~ user.profile_picture) }}"
    class="{{ avatar_class|default('avatar') }}"
    alt="{{ user.full_name }}"
>

{% else %}

<img
    src="{{ url_for('static', filename='images/default_avatar.webp') }}"
    class="{{ avatar_class|default('avatar') }}"
    alt="{{ user.full_name }}"
>

{% endif %}
