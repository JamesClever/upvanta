{% extends "base.html" %}

{% block title %}
Login - Upvanta
{% endblock %}

{% block extra_css %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/pages/auth.css') }}">
{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Login to continue your career journey with Upvanta.
        </p>

        <form method="POST">

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <button
                type="submit"
                class="primary-btn auth-btn">

                Login

            </button>

        </form>

        <p class="auth-footer">

            Don't have an account?

            <a href="{{ url_for('auth.register') }}">
                Create one
            </a>

        </p>

    </div>

</section>

{% endblock %}
